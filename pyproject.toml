[project]
name = "projeto-clima"
version = "0.1.0"
description = "Dashboard para comparar temperaturas atuais em localidades configuráveis"
readme = "README.md"
requires-python = ">=3.11.5,<3.13"
dependencies = ["streamlit>=1.40,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projeto_clima"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["projeto_clima"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.taskipy.tasks]
docs = "mkdocs serve"
docs-build = "mkdocs build"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
