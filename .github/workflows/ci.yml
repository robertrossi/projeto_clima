name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"

      - name: Instalar Python
        run: uv python install 3.12

      - name: Sincronizar dependências
        run: uv sync --locked --all-groups

      - name: Verificar lint
        run: uv run --locked ruff check .

      - name: Verificar formatação
        run: uv run --locked ruff format --check .

      - name: Executar testes com cobertura
        run: uv run --locked pytest --cov=projeto_clima --cov-report=term-missing --cov-fail-under=50

      - name: Compilar documentação
        run: uv run --locked mkdocs build
